<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACEBOOKA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f1f3f6;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
  background:white;
  padding:40px 30px;
  border-radius:25px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
  text-align:center;
}

h1{
  color:#1877f2;
  font-size:45px;
  margin-bottom:15px;
}

.subtitle{
  color:#555;
  font-size:20px;
  line-height:1.5;
  margin-bottom:35px;
}

button{
  width:100%;
  border:0;
  padding:17px;
  border-radius:12px;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

.signup{
  background:#36b82f;
}

.login{
  background:#1877f2;
}

.back{
  background:#777;
}

.form{
  display:none;
}

.form h2{
  color:#1877f2;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.message{
  margin-top:15px;
  color:#333;
  font-weight:bold;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

  <div id="home">
    <h1>Karibu<br>FACEBOOKA</h1>

    <p class="subtitle">
      Unganisha • Shiriki • Jenga<br><br>
      Jiunge na marafiki, shiriki picha na video,
      na zungumza na watu mtandaoni.
    </p>

    <button class="signup" onclick="showSignup()">
      FUNGUA AKAUNTI
    </button>

    <button class="login" onclick="showLogin()">
      INGIA
    </button>
  </div>


  <div id="signupForm" class="form">

    <h2>Fungua Akaunti</h2>

    <input
      id="signupName"
      type="text"
      placeholder="Jina lako">

    <input
      id="signupEmail"
      type="email"
      placeholder="Email">

    <input
      id="signupPassword"
      type="password"
      placeholder="Password">

    <button class="signup" onclick="signup()">
      JISAJILI
    </button>

    <button class="back" onclick="goHome()">
      RUDI
    </button>

    <div id="signupMessage" class="message"></div>

  </div>


  <div id="loginForm" class="form">

    <h2>Ingia FACEBOOKA</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email">

    <input
      id="loginPassword"
      type="password"
      placeholder="Password">

    <button class="login" onclick="login()">
      INGIA
    </button>

    <button class="back" onclick="goHome()">
      RUDI
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://rtkmtafntstvdodgkfcv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SVZgmsCL0QpRcMsgUCBdUw_OYM11kmF";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* PAGE NAVIGATION */

function showSignup(){

  document.getElementById("home").style.display="none";

  document.getElementById("loginForm").style.display="none";

  document.getElementById("signupForm").style.display="block";
}


function showLogin(){

  document.getElementById("home").style.display="none";

  document.getElementById("signupForm").style.display="none";

  document.getElementById("loginForm").style.display="block";
}


function goHome(){

  document.getElementById("home").style.display="block";

  document.getElementById("signupForm").style.display="none";

  document.getElementById("loginForm").style.display="none";
}


/* SIGN UP */

async function signup(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("signupMessage");


  if(
    name === "" ||
    email === "" ||
    password === ""
  ){

    message.innerText =
      "Tafadhali jaza taarifa zote.";

    return;
  }


  if(password.length < 6){

    message.innerText =
      "Password iwe na angalau herufi 6.";

    return;
  }


  message.innerText =
    "Tafadhali subiri...";


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {
          full_name: name
        }

      }

    });


  if(error){

    message.innerText =
      "Usajili umeshindikana: " +
      error.message;

    return;
  }


  message.innerText =
    "Akaunti imefunguliwa! 🎉";
}


/* LOGIN */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if(
    email === "" ||
    password === ""
  ){

    message.innerText =
      "Tafadhali jaza email na password.";

    return;
  }


  message.innerText =
    "Tafadhali subiri...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){

    message.innerText =
      "Login imeshindikana: " +
      error.message;

    return;
  }


  message.innerText =
    "Umeingia FACEBOOKA vizuri! 🎉";

}

</script>

</body>
</html>
